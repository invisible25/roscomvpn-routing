name: Invisible Net — sync happRouting

# Тянет upstream-профиль roscomvpn, подставляет наше имя профиля и складывает
# результат в INVISIBLENET/happ-routing.deeplink. Оттуда его забирает контейнер
# routing-updater на мастере и кладёт в панель Remnawave.
#
# Upstream обновляется около 06:00 UTC, поэтому идём следом.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invisiblenet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Падает сам, если категория профиля отсутствует в geo-файлах —
      # тогда ничего не коммитится и до клиентов битое не доезжает.
      - name: Собрать профиль
        run: python INVISIBLENET/build.py

      - name: Закоммитить, если изменилось
        run: |
          set -euo pipefail
          if git diff --quiet -- INVISIBLENET/happ-routing.deeplink; then
            echo "изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INVISIBLENET/happ-routing.deeplink
          git commit -m "happRouting: sync $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push
